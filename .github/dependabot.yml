version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # Major updates are deferred to a planned upgrade.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      # Moves with the Vite major upgrade.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: cargo
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # The race engine is pinned to a reviewed fork commit and updated by hand.
    ignore:
      - dependency-name: uma_race_sim
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # tauri-action majors change the updater manifest; upgrade during a tested desktop release.
    ignore:
      - dependency-name: tauri-apps/tauri-action
        update-types: ["version-update:semver-major"]
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
