name: Verify build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  desktop-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            paths=$(git ls-tree -r --name-only "$HEAD" -- apps/desktop/ packages/core/)
          else
            paths=$(git diff --name-only "$BASE" "$HEAD" -- apps/desktop/ packages/core/)
          fi
          if [[ -n "$paths" ]]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
  desktop:
    needs: desktop-changes
    if: needs.desktop-changes.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @umalytics/desktop typecheck
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked -- -D warnings
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build:all
  layout:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PREVIEW_BROWSER: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @umalytics/extension exec playwright install --with-deps chromium
      - run: pnpm --filter @umalytics/extension preview:shots
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: layout-shots
          path: apps/extension/dev/preview/.shots
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
