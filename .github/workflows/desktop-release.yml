name: Build desktop release
on:
  push:
    branches: [main]
    paths: ['apps/desktop/package.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'kjunodev/umalytics' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      skip: ${{ steps.prepare.outputs.skip }}
      version: ${{ steps.prepare.outputs.version }}
      source: ${{ steps.prepare.outputs.source }}
      release-id: ${{ steps.draft.outputs.release-id }}
      release-body: ${{ steps.draft.outputs.release-body }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Select release source
        id: prepare
        run: node apps/desktop/scripts/release.mjs prepare
      - name: Check out immutable draft source
        if: steps.prepare.outputs.skip != 'true'
        env:
          DESKTOP_SOURCE: ${{ steps.prepare.outputs.source }}
        run: git checkout --detach "$DESKTOP_SOURCE"
      - name: Create non-latest draft
        if: steps.prepare.outputs.skip != 'true'
        id: draft
        env:
          DESKTOP_VERSION: ${{ steps.prepare.outputs.version }}
          DESKTOP_SOURCE: ${{ steps.prepare.outputs.source }}
        run: node apps/desktop/scripts/release.mjs draft "$DESKTOP_VERSION"
  windows:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install and verify
        run: |
          if ((pnpm --version) -ne '9.15.4') { throw 'pnpm 9.15.4 required' }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node apps/desktop/scripts/prepare-resources.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.prepare.outputs.release-id }}
          tagName: desktop-v${{ needs.prepare.outputs.version }}
          releaseDraft: true
          releaseBody: ${{ needs.prepare.outputs.release-body }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
  macos:
    # tauri-action merges latest.json from the draft; serialize both writers.
    needs: [prepare, windows]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: node apps/desktop/scripts/prepare-resources.mjs
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.prepare.outputs.release-id }}
          tagName: desktop-v${{ needs.prepare.outputs.version }}
          releaseDraft: true
          releaseBody: ${{ needs.prepare.outputs.release-body }}
          includeUpdaterJson: true
          args: --target universal-apple-darwin
