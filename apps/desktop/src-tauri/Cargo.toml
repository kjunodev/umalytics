[package]
name = "umalytics-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "macros"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uma_race_sim = { git = "https://github.com/kachi-dev/uma-race-simulator", rev = "1750b13d56bf96a3608c9e108b6131170ad98ef8" }

# Keep interactive simulations and native tests usable in development too.
[profile.dev.package.uma_race_sim]
opt-level = 3
