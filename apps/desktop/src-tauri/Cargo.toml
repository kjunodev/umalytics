[package]
name = "umalytics-desktop"
version = "0.1.7"
edition = "2021"
rust-version = "1.90"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uma_race_sim = { git = "https://github.com/skimuic/uma-race-simulator", rev = "f534bef5706b59b54c9c5571753ea43acf715ac3" }
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
png = "0.18"
windows = { version = "0.62", features = ["Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_System_WinRT"] }

# Keep interactive simulations and native tests usable in development too.
[profile.dev.package.uma_race_sim]
opt-level = 3
